name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Lint
      run: npm run lint

    - name: Run tests
      run: npx vitest run

    - name: Generate Prisma Client
      run: npx prisma generate

    - name: Build
      run: npm run build
      env:
        DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/unused"
        NEXTAUTH_SECRET: "dummy-secret"
        NEXTAUTH_URL: "http://localhost:3000"
        GOOGLE_CLIENT_ID: "dummy-id"
        GOOGLE_CLIENT_SECRET: "dummy-secret"
        CRON_SECRET: "dummy-cron-secret"
